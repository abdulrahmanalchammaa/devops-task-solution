version: '3'
services:
  mssqlserver:
    image: mcr.microsoft.com/mssql/server:2022-preview-ubuntu-22.04
    environment:
      SA_PASSWORD: Un!q@to2023
      ACCEPT_EULA: Y
      MSSQL_DB: 'db_vero_digital'
    ports:
      - "1433:1433"

  php:
    build:
      context: .
      dockerfile: Dockerfile 
    ports:
      - "9000:9000"
    links:
      - mssqlserver

  nginx:
    image: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      SQL_SERVER_HOST: mssqlserver   
      SQL_SERVER_PORT: 1433           
      SQL_SERVER_DB: 'db_vero_digital'  
      SQL_SERVER_USER: 'sa'            
      SQL_SERVER_PASSWORD: 'Un!q@to2023'  
    links:
      - php
    depends_on:
      - php


